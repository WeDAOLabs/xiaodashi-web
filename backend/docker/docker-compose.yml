# =============================================================================
# 开发环境 Docker Compose 配置 - xiaodashi-web Backend
# =============================================================================
# 特性：热重载、调试支持、外部服务连接
# 用途：本地开发环境
# =============================================================================

version: '3.8'

services:
  # xiaodashi-web 后端服务
  backend:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: xiaodashi-backend-dev
    restart: unless-stopped

    # 端口映射
    ports:
      - "${PORT:-2999}:2999"  # API服务端口
      - "9229:9229"           # 调试端口

    # 环境变量
    environment:
      NODE_ENV: development
      PORT: ${PORT:-2999}

      # 数据库配置（连接外部数据库）
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-60000}

      # Redis配置（连接外部Redis）
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}

      # JWT配置
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # 安全配置
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}

      # 应用配置
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:3001}

      # 开发配置
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      DEBUG: ${DEBUG:-true}
      SHOW_ERROR_DETAILS: ${SHOW_ERROR_DETAILS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      # 验证码配置（开发环境可以关闭）
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}

    # 卷挂载（支持热重载）
    volumes:
      - ../shared:/app/shared:ro          # shared包只读挂载
      - ./src:/app/backend/src            # 源代码热重载
      - ./package.json:/app/backend/package.json:ro
      - ./tsconfig.json:/app/backend/tsconfig.json:ro
      - ./tsconfig.build.json:/app/backend/tsconfig.build.json:ro
      - ./test:/app/backend/test:ro        # 测试文件

    # 网络配置
    networks:
      - xiaodashi-network

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # 依赖外部服务（通过health check间接保证）
    depends_on: []

# 网络配置
networks:
  xiaodashi-network:
    name: xiaodashi-dev-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置（如果需要）
volumes:
  # 可以在这里定义需要持久化的数据卷
  # 例如：日志卷、缓存卷等
  backend-logs:
    name: xiaodashi-backend-logs-dev
    driver: local