# =============================================================================
# 开发环境 Docker Compose 配置 - xiaodashi-web Backend
# =============================================================================
# 特性：热重载、调试支持、外部服务连接
# 用途：本地开发环境
# =============================================================================

version: '3.8'

services:
  # xiaodashi-web 后端服务
  backend:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: xiaodashi-backend-dev
    restart: unless-stopped

    # 端口映射
    ports:
      - "${PORT:-2999}:2999"  # API服务端口
      - "9229:9229"           # 调试端口

    # 环境变量（开发环境配置）
    # 优先级：.env (应用配置) < .env.docker (Docker配置) < environment (硬编码覆盖)
    env_file:
      - .env        # 应用配置（数据库、JWT、Redis等）
      - .env.docker # Docker 配置（镜像、资源限制等）

    # 硬编码环境变量覆盖（确保开发环境特定配置）
    environment:
      NODE_ENV: development
      PORT: ${PORT:-2999}
      
      # 开发环境特定配置（强制覆盖）
      SWAGGER_ENABLED: true
      DEBUG: true
      SHOW_ERROR_DETAILS: true
      LOG_LEVEL: debug
      CAPTCHA_ENABLED: false

    # 卷挂载（支持热重载）
    volumes:
      - ../../shared:/app/shared:ro          # shared包只读挂载
      - ../src:/app/backend/src              # 源代码热重载
      - ../package.json:/app/backend/package.json:ro
      - ../tsconfig.json:/app/backend/tsconfig.json:ro
      - ../tsconfig.build.json:/app/backend/tsconfig.build.json:ro
      - ../test:/app/backend/test:ro         # 测试文件

    # 网络配置
    networks:
      - xiaodashi-network

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # 依赖外部服务（通过health check间接保证）
    depends_on: []

# 网络配置
networks:
  xiaodashi-network:
    name: xiaodashi-dev-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置（如果需要）
volumes:
  # 可以在这里定义需要持久化的数据卷
  # 例如：日志卷、缓存卷等
  backend-logs:
    name: xiaodashi-backend-logs-dev
    driver: local